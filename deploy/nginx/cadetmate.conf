# CadetMate public cache. Put the proxy_cache_path line in the http { } block.
# proxy_cache_path /var/cache/nginx/cadetmate levels=1:2 keys_zone=cadetmate_public:32m max_size=1g inactive=4h use_temp_path=off;

# Supabase SSR cookies look like sb-<project>-auth-token (and .0 / .1 chunks).
map $http_cookie $cadetmate_has_session {
    default 0;
    "~*sb-[^=;]*auth-token" 1;
}

map $request_method $cadetmate_unsafe_method {
    default 1;
    GET 0;
    HEAD 0;
}

map $uri $cadetmate_private_route {
    default 0;
    ~^/(api|admin|auth|dashboard|settings|profile|community|modules|practice|learn|progress|trb|flashcards|store|unit-modules|sea-survival|unauthorized|reset-password|logout) 1;
}

map "$cadetmate_has_session:$cadetmate_unsafe_method:$cadetmate_private_route" $cadetmate_skip_cache {
    default 1;
    "0:0:0" 0;
}

upstream cadetmate_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name cadetmate.co.uk;

    # ssl_certificate and ssl_certificate_key are set on the server.

    # Content-hashed JS/CSS. Next names these /_next/static/<buildId>/... and chunks end in a hash.
    location /_next/static/ {
        proxy_pass http://cadetmate_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /images/ {
        proxy_pass http://cadetmate_next;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://cadetmate_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache cadetmate_public;
        proxy_cache_bypass $cadetmate_skip_cache;
        proxy_no_cache $cadetmate_skip_cache $upstream_http_set_cookie;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
